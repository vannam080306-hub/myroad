<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f0">
  <title>Project | Sơ đồ tư duy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

    :root {
      color-scheme: light;
      --paper: #f4f5f0;
      --white: #fff;
      --ink: #202721;
      --muted: #778078;
      --line: #e7e9e2;
      --green: #2b5947;
      --green-light: #e8efe8;
      --coral: #e67d61;
      --shadow: 0 10px 30px rgba(31, 42, 34, .08);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 360px; height: 100vh; overflow: hidden; background: var(--paper); color: var(--ink); font: 15px 'DM Sans', sans-serif; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app { height: 100%; display: grid; grid-template-rows: 62px 1fr; }
    .topbar { display: flex; align-items: center; gap: 26px; padding: 0 22px; background: var(--white); border-bottom: 1px solid var(--line); z-index: 5; }
    .brand { display: flex; align-items: center; gap: 10px; font: 800 19px 'Manrope', sans-serif; letter-spacing: -.5px; white-space: nowrap; }
    .brand-mark { position: relative; width: 27px; height: 27px; border-radius: 8px; background: var(--green); }
    .brand-mark:before, .brand-mark:after { content: ''; position: absolute; background: #d9ebdc; border-radius: 2px; }
    .brand-mark:before { width: 3px; height: 16px; left: 12px; top: 6px; }
    .brand-mark:after { width: 11px; height: 3px; left: 7px; top: 10px; box-shadow: 0 7px 0 #d9ebdc; }
    .top-divider { width: 1px; height: 26px; background: var(--line); }
    .doc-title { width: min(230px, 24vw); padding: 7px 9px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); font: 700 14px 'Manrope', sans-serif; outline: none; }
    .doc-title:focus { border-color: #cfd7cd; background: #fbfcfa; }
    .saved-state { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .saved-dot { width: 7px; height: 7px; border-radius: 50%; background: #68a47c; }
    .top-spacer { flex: 1; }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap svg { position: absolute; left: 11px; color: #879087; pointer-events: none; }
    .search { width: 190px; height: 36px; padding: 0 10px 0 34px; border: 1px solid var(--line); border-radius: 6px; outline: none; background: #fbfcfa; font-size: 14px; }
    .search:focus { border-color: #afc2b2; }
    .button { height: 36px; display: inline-flex; justify-content: center; align-items: center; gap: 7px; padding: 0 11px; border: 1px solid var(--line); border-radius: 6px; background: white; cursor: pointer; font-size: 13px; font-weight: 600; transition: background .15s, border-color .15s, transform .15s; white-space: nowrap; }
    .button:hover { background: #f7f9f5; border-color: #cbd3c8; }
    .button:active { transform: translateY(1px); }
    .button.primary { background: var(--green); color: white; border-color: var(--green); }
    .button.primary:hover { background: #224b39; }
    .button.icon { width: 34px; padding: 0; }
    .button:disabled { opacity: .38; cursor: default; }
    .button svg, .tool svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .workspace { min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
    .workspace.sidebar-hidden { grid-template-columns: 0 minmax(0, 1fr); }
    .leftbar { position: relative; z-index: 3; background: var(--white); border-right: 1px solid var(--line); padding: 22px 14px; overflow: hidden; transition: padding .2s, border-width .2s; }
    .workspace.sidebar-hidden .leftbar { padding-left: 0; padding-right: 0; border-right-width: 0; }
    .side-label { padding: 0 10px; color: #727d73; font: 500 11px 'DM Mono', monospace; letter-spacing: .5px; text-transform: uppercase; }
    .project-list { display: grid; gap: 5px; margin-top: 10px; }
    .map-row { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink); text-align: left; font-size: 14px; cursor: pointer; }
    .map-row:hover { background: #f5f7f3; }
    .map-row.active { background: #f0f4ef; color: var(--green); font-weight: 700; }
    .map-row svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .map-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .project-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .project-heading .button { flex: none; width: 32px; height: 32px; padding: 0; }
    .side-section { margin-top: 35px; }
    .side-tools { margin-top: 10px; display: grid; gap: 3px; }
    .tool { width: 100%; min-height: 42px; padding: 0 10px; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 5px; background: transparent; text-align: left; font-size: 14px; cursor: pointer; }
    .tool:hover { background: #f5f7f3; }
    .tool:disabled { opacity: .4; cursor: default; }
    .tool svg { color: #6f786f; }
    .key { margin-left: auto; color: #818a81; font: 11px 'DM Mono', monospace; }

    .canvas-area { position: relative; min-width: 0; overflow: hidden; background-color: #f7f8f4; background-image: radial-gradient(#dfe3dc 0.8px, transparent .8px); background-size: 19px 19px; }
    .canvas-top { position: absolute; z-index: 2; top: 18px; left: 20px; display: flex; align-items: center; gap: 8px; color: #727c73; font: 11px 'DM Mono', monospace; }
    .canvas-top .crumb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); }
    .canvas-top strong { color: #647066; font-weight: 500; }
    .stage { position: absolute; left: 50%; top: 50%; width: 2400px; height: 1600px; transform-origin: center; will-change: transform; }
    .links { position: absolute; inset: 0; width: 2400px; height: 1600px; overflow: visible; pointer-events: none; }
    .links path { fill: none; stroke-width: 2.5; stroke-linecap: round; opacity: .78; }
    .mind-node { position: absolute; min-width: 144px; max-width: 190px; min-height: 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 10px 13px; border: 1px solid #e1e6de; border-radius: 7px; background: white; box-shadow: 0 3px 10px rgba(38, 54, 42, .06); color: var(--ink); font-size: 15px; line-height: 1.4; font-weight: 600; cursor: grab; user-select: none; transition: box-shadow .15s, border-color .15s, transform .15s; }
    .mind-node:hover { border-color: #bbcbbb; box-shadow: 0 5px 16px rgba(38, 54, 42, .12); }
    .mind-node.selected { border: 2px solid var(--node-color, var(--green)); padding: 9px 12px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--node-color, var(--green)) 12%, transparent), 0 5px 15px rgba(38, 54, 42, .1); }
    .mind-node.root { min-width: 188px; min-height: 64px; justify-content: center; padding: 13px 17px; border: 0; border-radius: 9px; background: var(--green); color: white; font: 700 15px 'Manrope', sans-serif; text-align: center; box-shadow: 0 8px 20px rgba(43, 89, 71, .2); }
    .node-dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--node-color); }
    .mind-node.root .node-dot { display: none; }
    .node-text { overflow-wrap: anywhere; pointer-events: none; }
    .node-meta { display: flex; flex-basis: 100%; flex-wrap: wrap; gap: 4px; padding-left: 18px; font: 600 10px 'DM Sans', sans-serif; }
    .priority-badge, .deadline-badge { display: inline-flex; align-items: center; gap: 4px; width: fit-content; padding: 2px 6px; border-radius: 12px; background: #f0f2ef; color: #536056; line-height: 1.4; }
    .priority-high { background: #fbe9e5; color: #a6412d; }
    .priority-medium { background: #fff2d8; color: #875b09; }
    .priority-low { background: #e8f1e8; color: #386447; }
    .mind-node.root .node-meta { justify-content: center; padding-left: 0; }
    .mind-node input { width: 100%; min-width: 90px; padding: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
    .mind-node.root input { text-align: center; }
    .zoom-controls { position: absolute; z-index: 2; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 4px; padding: 5px; border: 1px solid #e5e8e1; border-radius: 7px; background: white; box-shadow: 0 4px 12px rgba(40, 48, 39, .06); }
    .zoom-controls .button { border: 0; }
    .zoom-level { min-width: 43px; color: #68726a; text-align: center; font: 12px 'DM Mono', monospace; }
    .canvas-hint { position: absolute; right: 20px; bottom: 26px; color: #747e75; font-size: 12px; }
    .view-switch { position: absolute; z-index: 3; top: 12px; right: 16px; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: white; box-shadow: 0 3px 10px rgba(38, 54, 42, .06); }
    .view-button { min-height: 30px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: #58645a; cursor: pointer; font-size: 12px; font-weight: 600; }
    .view-button[aria-pressed="true"] { background: var(--green-light); color: var(--green); }
    .task-view { position: absolute; inset: 58px 18px 54px; overflow: auto; }
    .task-view[hidden] { display: none; }
    .task-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; color: #657067; font-size: 13px; }
    .task-toolbar select, .task-card select { min-height: 32px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--ink); }
    .task-board { display: grid; grid-template-columns: repeat(3, minmax(210px, 1fr)); align-items: start; gap: 14px; min-width: 680px; }
    .task-column { min-height: 180px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.7); }
    .task-column h3 { display: flex; justify-content: space-between; margin: 0 0 10px; color: #465349; font-size: 13px; }
    .task-cards { display: grid; gap: 8px; }
    .task-card { padding: 12px; border: 1px solid var(--line); border-left: 3px solid var(--node-color, var(--green)); border-radius: 7px; background: white; box-shadow: 0 2px 8px rgba(38,54,42,.04); cursor: pointer; }
    .task-card:hover { border-color: #bdcbbc; }
    .task-card-title { margin-bottom: 8px; font-weight: 700; overflow-wrap: anywhere; }
    .task-card-meta { display: flex; flex-wrap: wrap; gap: 5px; color: #69746b; font-size: 11px; }
    .task-card select { width: 100%; margin-top: 10px; font-size: 12px; }
    .task-list { width: 100%; border-collapse: collapse; background: rgba(255,255,255,.82); }
    .task-list th, .task-list td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; }
    .task-list th { position: sticky; top: 0; background: #f1f4ef; color: #5c685e; font-size: 12px; }
    .task-list td:first-child { font-weight: 600; }
    .task-list tbody tr { cursor: pointer; }
    .task-list tbody tr:hover { background: #f6f8f4; }
    .empty-view { padding: 32px; color: var(--muted); text-align: center; }
    .action-menu { position: relative; }
    .action-menu summary { list-style: none; }
    .action-menu summary::-webkit-details-marker { display: none; }
    .action-menu[open] { z-index: 10; }
    .action-menu-list { position: absolute; top: calc(100% + 6px); right: 0; display: grid; min-width: 180px; gap: 3px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: white; box-shadow: var(--shadow); }
    .action-menu-list .button { justify-content: flex-start; border: 0; }

    .details-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; background: rgba(24, 34, 27, .42); }
    .details-overlay[hidden] { display: none; }
    .details-dialog { width: min(600px, 100%); max-height: min(760px, 90vh); overflow-y: auto; padding: 28px; border: 1px solid var(--line); border-radius: 14px; background: white; box-shadow: 0 24px 70px rgba(20, 33, 24, .2); }
    .details-heading { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 24px; }
    .details-title-wrap { min-width: 0; flex: 1; }
    .details-title { margin: 0; overflow-wrap: anywhere; font: 800 24px 'Manrope', sans-serif; }
    .topic-kind { display: inline-block; margin-top: 8px; padding: 4px 9px; border-radius: 20px; background: var(--green-light); color: var(--green); font-size: 13px; font-weight: 700; }
    .topic-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .topic-option { min-width: 0; }
    .topic-option .field-label { margin-top: 0; }
    .topic-option select, .topic-option input { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); }
    .details-close { flex: none; width: 38px; height: 38px; }
    .field-label { display: block; margin: 20px 0 9px; color: #536056; font-size: 14px; font-weight: 700; }
    .topic-field { width: 100%; min-height: 150px; resize: vertical; padding: 13px; border: 1px solid var(--line); border-radius: 7px; outline: none; font-size: 15px; line-height: 1.6; }
    .topic-field:focus { border-color: #a9bea9; }
    .attachment-input { display: none; }
    .attachment-list { display: grid; gap: 8px; margin-top: 14px; }
    .attachment-item { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; }
    .attachment-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #455247; font-size: 14px; }
    .attachment-item .button { height: 30px; }
    .toast { position: absolute; z-index: 30; left: 50%; bottom: 24px; transform: translate(-50%, 12px); padding: 9px 14px; border-radius: 6px; background: #26372c; color: white; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .file-input { display: none; }

    @media (max-width: 1000px) {
      .workspace { grid-template-columns: 230px minmax(0, 1fr); }
      .search { width: 150px; }
    }
    @media (max-width: 680px) {
      body { min-width: 360px; }
      .app { grid-template-rows: 56px 1fr; }
      .brand { font-size: 16px; }
      .brand-mark { width: 24px; height: 24px; }
      .top-divider, .saved-state, .search-wrap, .export-label { display: none; }
      .doc-title { width: min(126px, 35vw); font-size: 12px; }
      .topbar { gap: 8px; padding: 0 8px; }
      .top-spacer { display: none; }
      .topbar .button { width: 32px; height: 32px; padding: 0; font-size: 13px; }
      .action-menu-list { min-width: 158px; }
      .task-view { inset: 90px 10px 48px; }
      .view-switch { top: 44px; right: 8px; }
      .view-button { padding: 0 7px; font-size: 11px; }
      .topic-options { grid-template-columns: 1fr; gap: 4px; }
      .workspace, .workspace.sidebar-hidden { grid-template-columns: minmax(0, 1fr); }
      .workspace.sidebar-hidden .leftbar { display: none; }
      .leftbar { position: absolute; inset: 56px auto 0 0; width: min(290px, 85vw); overflow-y: auto; box-shadow: 12px 0 30px rgba(20, 33, 24, .12); }
      .canvas-top { top: 13px; left: 12px; }
      .canvas-hint { display: none; }
      .zoom-controls { left: 9px; bottom: 9px; }
      .details-dialog { padding: 22px; }
      .details-title { font-size: 21px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Project</div>
      <div class="top-divider"></div>
      <input class="doc-title" id="mapTitle" aria-label="Tên project" value="Kế hoạch dự án">
      <div class="saved-state"><span class="saved-dot"></span><span id="saveState">Đã lưu</span></div>
      <div class="top-spacer"></div>
      <button class="button icon" id="toggleSidebar" aria-label="Ẩn không gian làm việc" title="Ẩn không gian làm việc" aria-expanded="true" aria-controls="workspace">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <label class="search-wrap" aria-label="Tìm chủ đề">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="10.8" cy="10.8" r="6.7" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input class="search" id="searchInput" placeholder="Tìm chủ đề..." type="search">
      </label>
      <details class="action-menu">
        <summary class="button" aria-label="Mở menu tệp">
          <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span>Tệp</span>
        </summary>
        <div class="action-menu-list">
          <button class="button" id="importButton" title="Mở sơ đồ JSON">
            <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 14v5h14v-5"/></svg><span>Mở JSON</span>
          </button>
          <button class="button" id="exportJsonButton" title="Lưu sơ đồ dạng JSON">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v4h14v-4"/><path d="M8 7h1m6 0h1"/></svg><span>Xuất JSON</span>
          </button>
          <button class="button" id="exportButton" title="Xuất sơ đồ dạng SVG">
            <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 16v4h14v-4"/></svg><span>Xuất SVG</span>
          </button>
        </div>
      </details>
      <input class="file-input" id="fileInput" type="file" accept="application/json,.json">
    </header>

    <div class="workspace" id="workspace">
      <aside class="leftbar">
        <div class="project-heading">
          <div class="side-label">Không gian làm việc</div>
          <button class="button icon" id="createProject" aria-label="Tạo project mới" title="Tạo project mới">
            <svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg>
          </button>
        </div>
        <div class="project-list" id="projectList" aria-label="Danh sách project"></div>
        <section class="side-section">
          <div class="side-label">Hướng dẫn sử dụng</div>
          <div class="side-tools">
            <button class="tool" id="addChild"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h4a3 3 0 0 0 3-3V8.5M12.5 12a3 3 0 0 1 3 3v.5"/></svg><span>Thêm chủ đề phụ</span><span class="key">Tab</span></button>
            <button class="tool" id="addSibling"><svg viewBox="0 0 24 24"><path d="M12 4v16M12 8H6m6 8h6"/><circle cx="5" cy="8" r="2"/><circle cx="19" cy="16" r="2"/><circle cx="12" cy="4" r="1.5"/></svg><span>Thêm chủ đề phụ cùng cấp</span><span class="key">Enter</span></button>
            <button class="tool" id="editNode"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><span>Đổi tên chủ đề</span><span class="key">F2</span></button>
            <button class="tool" id="deleteNode"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg><span>Xóa chủ đề</span><span class="key">Del</span></button>
            <button class="tool" id="undoButton"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg><span>Hoàn tác</span><span class="key">Ctrl Z</span></button>
            <button class="tool" id="redoButton"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5m5 5H10a6 6 0 0 0 0 12h2"/></svg><span>Làm lại</span><span class="key">Ctrl Y</span></button>
          </div>
        </section>
      </aside>

      <section class="canvas-area" id="canvasArea" aria-label="Vùng sơ đồ tư duy">
        <div class="canvas-top"><span class="crumb-dot"></span><strong>PROJECT</strong><span>/</span><span id="canvasTitle">Kế hoạch dự án</span></div>
        <nav class="view-switch" aria-label="Chế độ xem project">
          <button class="view-button" type="button" data-view="map" aria-pressed="true">Sơ đồ</button>
          <button class="view-button" type="button" data-view="board" aria-pressed="false">Kanban</button>
          <button class="view-button" type="button" data-view="list" aria-pressed="false">Danh sách</button>
        </nav>
        <div class="stage" id="stage"><svg class="links" id="links" viewBox="0 0 2400 1600" aria-hidden="true"></svg><div id="nodes"></div></div>
        <div class="task-view" id="taskView" hidden></div>
        <div class="zoom-controls" id="zoomControls">
          <button class="button icon" id="zoomOut" aria-label="Thu nhỏ" title="Thu nhỏ"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
          <span class="zoom-level" id="zoomLabel">100%</span>
          <button class="button icon" id="zoomIn" aria-label="Phóng to" title="Phóng to"><svg viewBox="0 0 24 24"><path d="M12 5v14m-7-7h14"/></svg></button>
          <button class="button icon" id="fitButton" aria-label="Căn giữa sơ đồ" title="Căn giữa sơ đồ"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/><path d="M8 8h8v8H8z"/></svg></button>
        </div>
        <div class="canvas-hint">Kéo nền để di chuyển · Kéo chủ đề để sắp xếp</div>
      </section>

    </div>
    <div class="details-overlay" id="detailsOverlay" hidden>
      <section class="details-dialog" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
        <div class="details-heading">
          <div class="details-title-wrap">
            <h2 class="details-title" id="detailsTitle"></h2>
            <span class="topic-kind" id="topicKind"></span>
          </div>
          <button class="button icon details-close" id="closeDetails" aria-label="Đóng chi tiết" title="Đóng">
            <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="topic-options">
          <label class="topic-option"><span class="field-label">Mức độ ưu tiên</span>
            <select id="topicPriority" aria-label="Mức độ ưu tiên">
              <option value="low">Thấp</option><option value="medium">Trung bình</option><option value="high">Cao</option>
            </select>
          </label>
          <label class="topic-option"><span class="field-label">Hạn deadline</span>
            <input id="topicDeadline" type="date" aria-label="Hạn deadline">
          </label>
          <label class="topic-option"><span class="field-label">Trạng thái</span>
            <select id="topicStatus" aria-label="Trạng thái công việc">
              <option value="todo">Cần làm</option><option value="inprogress">Đang làm</option><option value="done">Hoàn thành</option>
            </select>
          </label>
        </div>
        <label class="field-label" for="topicText">Ghi chú</label>
        <textarea class="topic-field" id="topicText"></textarea>
        <label class="field-label" for="attachmentInput">Tài liệu</label>
        <input class="attachment-input" id="attachmentInput" type="file" multiple>
        <button class="button" id="uploadAttachment">
          <svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 14v5h14v-5"/></svg>Tải tài liệu lên
        </button>
        <div class="attachment-list" id="attachmentList"></div>
      </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'project-mindmap-v2';
      const LEGACY_STORAGE_KEY = 'mach-mindmap-v1';
      const COLORS = ['#e67d61', '#4f8a67', '#d7a447', '#6488b5', '#a474a0', '#6d8175'];
      const initialMap = {
        id: 'project-default',
        title: 'Kế hoạch dự án',
        nodes: [
          { id: 'root', parent: null, text: 'Kế hoạch dự án', color: '#2b5947', x: 0, y: 0 },
          { id: 'goal', parent: 'root', text: 'Mục tiêu', color: '#e67d61', x: 300, y: -265 },
          { id: 'research', parent: 'root', text: 'Nghiên cứu', color: '#4f8a67', x: -300, y: -90 },
          { id: 'roadmap', parent: 'root', text: 'Lộ trình', color: '#d7a447', x: 300, y: 95 },
          { id: 'resources', parent: 'root', text: 'Nguồn lực', color: '#6488b5', x: -300, y: 270 },
          { id: 'goal-1', parent: 'goal', text: 'Giải quyết vấn đề nào?', color: '#e67d61', x: 560, y: -315 },
          { id: 'goal-2', parent: 'goal', text: 'Kết quả mong đợi', color: '#e67d61', x: 560, y: -215 },
          { id: 'research-1', parent: 'research', text: 'Người dùng', color: '#4f8a67', x: -560, y: -140 },
          { id: 'research-2', parent: 'research', text: 'Giải pháp hiện có', color: '#4f8a67', x: -560, y: -40 },
          { id: 'roadmap-1', parent: 'roadmap', text: 'Các cột mốc', color: '#d7a447', x: 560, y: 45 },
          { id: 'roadmap-2', parent: 'roadmap', text: 'Thời hạn', color: '#d7a447', x: 560, y: 145 },
          { id: 'resources-1', parent: 'resources', text: 'Nhân sự', color: '#6488b5', x: -560, y: 220 },
          { id: 'resources-2', parent: 'resources', text: 'Ngân sách', color: '#6488b5', x: -560, y: 320 }
        ]
      };
      const el = (id) => document.getElementById(id);
      const projectsState = loadProjects();
      let map = projectsState.projects.find(project => project.id === projectsState.activeProjectId) || projectsState.projects[0];
      let selectedId = 'root';
      let zoom = .65;
      let pan = { x: 0, y: 0 };
      let history = [];
      let historyIndex = -1;
      let saveTimer;
      let toastTimer;
      let drag = null;
      let editingId = null;
      let activeView = 'map';
      let taskSort = 'deadline';

      function loadProjects() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && Array.isArray(saved.projects) && saved.projects.length) {
            const projects = saved.projects.filter(project => project && project.id && Array.isArray(project.nodes) && project.nodes.some(node => node.id === 'root'));
            if (projects.length) return { projects, activeProjectId: projects.some(project => project.id === saved.activeProjectId) ? saved.activeProjectId : projects[0].id, sidebarVisible: saved.sidebarVisible !== false };
          }
          const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY));
          if (legacy && Array.isArray(legacy.nodes) && legacy.nodes.some(node => node.id === 'root')) {
            return { projects: [{ ...legacy, id: 'project-default' }], activeProjectId: 'project-default', sidebarVisible: true };
          }
        } catch (_) { /* Fall back to the starter project if stored data is invalid. */ }
        return { projects: [JSON.parse(JSON.stringify(initialMap))], activeProjectId: 'project-default', sidebarVisible: true };
      }

      function persistProjects() {
        const activeIndex = projectsState.projects.findIndex(project => project.id === map.id);
        if (activeIndex !== -1) projectsState.projects[activeIndex] = map;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(projectsState));
          el('saveState').textContent = 'Đã lưu';
          return true;
        } catch (error) {
          el('saveState').textContent = 'Lỗi lưu';
          showToast('Không thể lưu project vào bộ nhớ trình duyệt');
          return false;
        }
      }

      function snapshot() {
        const value = JSON.stringify(map);
        if (history[historyIndex] === value) return;
        history = history.slice(0, historyIndex + 1);
        history.push(value);
        if (history.length > 50) history.shift();
        historyIndex = history.length - 1;
        updateHistoryButtons();
      }

      function scheduleSave() {
        el('saveState').textContent = 'Đang lưu';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          persistProjects();
        }, 250);
      }

      function childrenOf(id) { return map.nodes.filter(node => node.parent === id); }
      function nodeById(id) { return map.nodes.find(node => node.id === id); }
      function visibleText(text) { return text || 'Chủ đề mới'; }
      function priorityOf(node) { return ['low', 'medium', 'high'].includes(node.priority) ? node.priority : 'medium'; }
      function priorityLabel(priority) { return ({ low: 'Thấp', medium: 'Trung bình', high: 'Cao' })[priority] || 'Trung bình'; }
      function deadlineLabel(deadline) {
        if (!deadline) return 'Chưa đặt hạn';
        const date = new Date(`${deadline}T00:00:00`);
        return Number.isNaN(date.getTime()) ? 'Ngày không hợp lệ' : date.toLocaleDateString('vi-VN');
      }
      function statusOf(node) { return ['todo', 'inprogress', 'done'].includes(node.status) ? node.status : 'todo'; }
      function statusLabel(status) { return ({ todo: 'Cần làm', inprogress: 'Đang làm', done: 'Hoàn thành' })[status] || 'Cần làm'; }

      function renderLinks() {
        const links = [];
        for (const node of map.nodes) {
          if (node.parent) {
            const parent = nodeById(node.parent);
            if (parent) {
              const side = node.x >= parent.x ? 1 : -1;
              const x1 = 1200 + parent.x + side * (parent.id === 'root' ? 94 : 86);
              const y1 = 800 + parent.y;
              const x2 = 1200 + node.x - side * 74;
              const y2 = 800 + node.y;
              const curve = Math.max(38, Math.abs(x2 - x1) * .48);
              links.push(`<path d="M ${x1} ${y1} C ${x1 + side * curve} ${y1}, ${x2 - side * curve} ${y2}, ${x2} ${y2}" stroke="${escapeAttr(node.color)}"/>`);
            }
          }
        }
        el('links').innerHTML = links.join('');
      }

      function render() {
        el('mapTitle').value = map.title;
        el('canvasTitle').textContent = map.title;
        renderProjects();
        el('nodes').replaceChildren();
        for (const node of map.nodes) {
          const item = document.createElement('div');
          item.className = `mind-node${node.id === 'root' ? ' root' : ''}${selectedId === node.id ? ' selected' : ''}`;
          item.dataset.id = node.id;
          item.tabIndex = 0;
          item.setAttribute('role', 'button');
          item.setAttribute('aria-label', `Xem chi tiết ${visibleText(node.text)}`);
          item.style.left = `${1200 + node.x}px`;
          item.style.top = `${800 + node.y}px`;
          item.style.transform = 'translate(-50%, -50%)';
          item.style.setProperty('--node-color', node.color || COLORS[0]);
          item.innerHTML = '<span class="node-dot"></span><span class="node-text"></span><span class="node-meta"></span>';
          item.querySelector('.node-text').textContent = visibleText(node.text);
          const priority = priorityOf(node);
          const badge = document.createElement('span');
          badge.className = `priority-badge priority-${priority}`;
          badge.textContent = `Ưu tiên ${priorityLabel(priority).toLocaleLowerCase('vi')}`;
          item.querySelector('.node-meta').append(badge);
          if (node.deadline) {
            const deadline = document.createElement('span');
            deadline.className = 'deadline-badge';
            deadline.textContent = deadlineLabel(node.deadline);
            item.querySelector('.node-meta').append(deadline);
          }
          item.setAttribute('aria-label', `${visibleText(node.text)}, ưu tiên ${priorityLabel(priority)}, hạn ${deadlineLabel(node.deadline)}`);
          item.addEventListener('pointerdown', startNodeDrag);
          item.addEventListener('click', () => selectNode(node.id));
          item.addEventListener('dblclick', () => { selectedId = node.id; render(); openTopicDetails(node.id); });
          item.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              event.stopPropagation();
              selectNode(node.id);
              openTopicDetails(node.id);
            }
          });
          el('nodes').append(item);
        }
        renderLinks();
        renderTaskView();
        applyTransform();
        updateHistoryButtons();
      }

      function renderTaskView() {
        const taskView = el('taskView');
        const mapView = activeView === 'map';
        el('stage').hidden = !mapView;
        el('zoomControls').hidden = !mapView;
        taskView.hidden = mapView;
        document.querySelectorAll('.view-button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === activeView)));
        if (mapView) return;
        taskView.replaceChildren();
        const nodes = map.nodes.filter(node => node.id !== 'root');
        if (activeView === 'board') {
          const board = document.createElement('div');
          board.className = 'task-board';
          const columns = [
            { id: 'todo', label: 'Cần làm' },
            { id: 'inprogress', label: 'Đang làm' },
            { id: 'done', label: 'Hoàn thành' }
          ];
          for (const column of columns) {
            const section = document.createElement('section');
            section.className = 'task-column';
            const heading = document.createElement('h3');
            const title = document.createElement('span');
            title.textContent = column.label;
            const count = document.createElement('span');
            count.textContent = String(nodes.filter(node => statusOf(node) === column.id).length);
            heading.append(title, count);
            const cards = document.createElement('div');
            cards.className = 'task-cards';
            for (const node of nodes.filter(item => statusOf(item) === column.id)) cards.append(createTaskCard(node, true));
            section.append(heading, cards);
            board.append(section);
          }
          taskView.append(board);
          return;
        }
        const toolbar = document.createElement('div');
        toolbar.className = 'task-toolbar';
        const label = document.createElement('label');
        label.textContent = 'Sắp xếp theo';
        label.htmlFor = 'taskSort';
        const sort = document.createElement('select');
        sort.id = 'taskSort';
        sort.innerHTML = '<option value="deadline">Hạn deadline, sau đó ưu tiên</option><option value="priority">Mức độ ưu tiên, sau đó deadline</option>';
        sort.value = taskSort;
        sort.addEventListener('change', () => { taskSort = sort.value; renderTaskView(); });
        toolbar.append(label, sort);
        const priorityOrder = { high: 0, medium: 1, low: 2 };
        const ordered = [...nodes].sort((first, second) => {
          const byPriority = priorityOrder[priorityOf(first)] - priorityOrder[priorityOf(second)];
          const byDeadline = (first.deadline || '9999-12-31').localeCompare(second.deadline || '9999-12-31');
          return taskSort === 'priority' ? byPriority || byDeadline : byDeadline || byPriority;
        });
        if (!ordered.length) {
          const empty = document.createElement('div');
          empty.className = 'empty-view';
          empty.textContent = 'Chưa có chủ đề công việc. Hãy thêm chủ đề vào sơ đồ.';
          taskView.append(toolbar, empty);
          return;
        }
        const table = document.createElement('table');
        table.className = 'task-list';
        table.innerHTML = '<thead><tr><th>Chủ đề</th><th>Ưu tiên</th><th>Deadline</th><th>Trạng thái</th></tr></thead>';
        const body = document.createElement('tbody');
        for (const node of ordered) {
          const row = document.createElement('tr');
          row.tabIndex = 0;
          row.addEventListener('click', () => selectNode(node.id));
          row.addEventListener('dblclick', () => { selectedId = node.id; render(); openTopicDetails(node.id); });
          const topic = document.createElement('td');
          topic.textContent = visibleText(node.text);
          const priorityCell = document.createElement('td');
          priorityCell.append(createPriorityBadge(node));
          const deadline = document.createElement('td');
          deadline.textContent = deadlineLabel(node.deadline);
          const status = document.createElement('td');
          status.textContent = statusLabel(statusOf(node));
          row.append(topic, priorityCell, deadline, status);
          body.append(row);
        }
        table.append(body);
        taskView.append(toolbar, table);
      }

      function createPriorityBadge(node) {
        const priority = priorityOf(node);
        const badge = document.createElement('span');
        badge.className = `priority-badge priority-${priority}`;
        badge.textContent = priorityLabel(priority);
        return badge;
      }

      function createTaskCard(node, showStatus) {
        const card = document.createElement('article');
        card.className = 'task-card';
        card.tabIndex = 0;
        card.style.setProperty('--node-color', node.color || COLORS[0]);
        card.addEventListener('click', () => selectNode(node.id));
        card.addEventListener('dblclick', () => { selectedId = node.id; render(); openTopicDetails(node.id); });
        const title = document.createElement('div');
        title.className = 'task-card-title';
        title.textContent = visibleText(node.text);
        const meta = document.createElement('div');
        meta.className = 'task-card-meta';
        meta.append(createPriorityBadge(node));
        const deadline = document.createElement('span');
        deadline.className = 'deadline-badge';
        deadline.textContent = deadlineLabel(node.deadline);
        meta.append(deadline);
        card.append(title, meta);
        if (showStatus) {
          const status = document.createElement('select');
          status.setAttribute('aria-label', `Trạng thái ${visibleText(node.text)}`);
          status.innerHTML = '<option value="todo">Cần làm</option><option value="inprogress">Đang làm</option><option value="done">Hoàn thành</option>';
          status.value = statusOf(node);
          status.addEventListener('click', event => event.stopPropagation());
          status.addEventListener('change', event => {
            node.status = event.target.value;
            snapshot();
            scheduleSave();
            renderTaskView();
          });
          card.append(status);
        }
        return card;
      }

      function escapeAttr(value) { return String(value).replace(/[&"<>]/g, char => ({ '&': '&amp;', '"': '&quot;', '<': '&lt;', '>': '&gt;' })[char]); }

      function renderProjects() {
        const list = el('projectList');
        list.replaceChildren();
        for (const project of projectsState.projects) {
          const button = document.createElement('button');
          button.className = `map-row${project.id === map.id ? ' active' : ''}`;
          button.type = 'button';
          const projectTitle = project.id === map.id ? map.title : project.title;
          button.title = projectTitle;
          button.setAttribute('aria-current', project.id === map.id ? 'page' : 'false');
          button.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><path d="m10 10-3.5-3.5M14 10l3.5-3.5M10 14l-3.5 3.5"/></svg>';
          const title = document.createElement('span');
          title.textContent = projectTitle;
          button.append(title);
          button.addEventListener('click', () => switchProject(project.id));
          list.append(button);
        }
      }

      function selectNode(id) {
        document.querySelectorAll('.mind-node.selected').forEach(item => item.classList.remove('selected'));
        selectedId = id;
        document.querySelector(`.mind-node[data-id="${CSS.escape(id)}"]`)?.classList.add('selected');
      }

      function openTopicDetails(id) {
        const node = nodeById(id);
        if (!node) return;
        node.note = node.note || '';
        node.attachments = Array.isArray(node.attachments) ? node.attachments : [];
        el('detailsTitle').textContent = visibleText(node.text);
        el('topicKind').textContent = node.id === 'root' ? 'Chủ đề chính' : 'Chủ đề phụ';
        el('topicPriority').value = priorityOf(node);
        el('topicDeadline').value = /^\d{4}-\d{2}-\d{2}$/.test(node.deadline || '') ? node.deadline : '';
        el('topicStatus').value = statusOf(node);
        el('topicText').value = node.note;
        renderAttachments(node);
        el('detailsOverlay').hidden = false;
        el('topicText').focus();
      }

      function closeTopicDetails() { el('detailsOverlay').hidden = true; }

      function renderAttachments(node) {
        const list = el('attachmentList');
        list.replaceChildren();
        node.attachments.forEach((attachment, index) => {
          const row = document.createElement('div');
          row.className = 'attachment-item';
          const name = document.createElement('span');
          name.className = 'attachment-name';
          name.textContent = attachment.name;
          name.title = attachment.name;
          const downloadLink = document.createElement('a');
          downloadLink.className = 'button';
          downloadLink.textContent = 'Tải xuống';
          downloadLink.href = attachment.dataUrl;
          downloadLink.download = attachment.name;
          const remove = document.createElement('button');
          remove.className = 'button';
          remove.type = 'button';
          remove.textContent = 'Xóa';
          remove.setAttribute('aria-label', `Xóa tài liệu ${attachment.name}`);
          remove.addEventListener('click', () => {
            node.attachments.splice(index, 1);
            renderAttachments(node);
            snapshot();
            scheduleSave();
          });
          row.append(name, downloadLink, remove);
          list.append(row);
        });
      }

      function createProject() {
        if (!persistProjects()) return;
        const id = `project-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
        map = {
          id,
          title: 'Project mới',
          nodes: [{ id: 'root', parent: null, text: 'Project mới', color: '#2b5947', x: 0, y: 0 }]
        };
        projectsState.projects.push(map);
        projectsState.activeProjectId = id;
        selectedId = 'root';
        history = [];
        historyIndex = -1;
        closeTopicDetails();
        render();
        fitMap();
        snapshot();
        persistProjects();
      }

      function switchProject(id) {
        if (id === map.id) return;
        clearTimeout(saveTimer);
        if (!persistProjects()) return;
        const project = projectsState.projects.find(item => item.id === id);
        if (!project) return;
        map = project;
        projectsState.activeProjectId = id;
        selectedId = 'root';
        history = [];
        historyIndex = -1;
        closeTopicDetails();
        render();
        fitMap();
        snapshot();
        persistProjects();
      }

      function addChild() {
        const parent = nodeById(selectedId);
        if (!parent) return;
        snapshot();
        const siblings = childrenOf(parent.id);
        const direction = parent.id === 'root' ? (siblings.length % 2 === 0 ? 1 : -1) : (parent.x >= nodeById(parent.parent)?.x ? 1 : -1);
        const child = { id: `n-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, parent: parent.id, text: 'Chủ đề mới', color: parent.id === 'root' ? COLORS[siblings.length % COLORS.length] : parent.color, priority: 'medium', status: 'todo', x: parent.x + direction * (parent.id === 'root' ? 300 : 250), y: parent.y + (siblings.length ? (siblings.length % 2 ? 100 : -100) : 0) };
        map.nodes.push(child);
        selectedId = child.id;
        activeView = 'map';
        snapshot(); scheduleSave(); render(); beginEdit(child.id);
      }

      function addSibling() {
        const node = nodeById(selectedId);
        if (!node || node.id === 'root') { addChild(); return; }
        const parent = nodeById(node.parent);
        if (!parent) return;
        snapshot();
        const siblings = childrenOf(parent.id);
        const sibling = { id: `n-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, parent: parent.id, text: 'Chủ đề mới', color: node.color, priority: 'medium', status: 'todo', x: node.x, y: node.y + (siblings.length % 2 ? 100 : -100) };
        map.nodes.push(sibling);
        selectedId = sibling.id;
        activeView = 'map';
        snapshot(); scheduleSave(); render(); beginEdit(sibling.id);
      }

      function deleteSelected() {
        const node = nodeById(selectedId);
        if (!node || node.id === 'root') return;
        snapshot();
        const removed = new Set([node.id]);
        let changed = true;
        while (changed) {
          changed = false;
          for (const item of map.nodes) if (removed.has(item.parent) && !removed.has(item.id)) { removed.add(item.id); changed = true; }
        }
        map.nodes = map.nodes.filter(item => !removed.has(item.id));
        selectedId = node.parent;
        snapshot(); scheduleSave(); render();
      }

      function beginEdit(id) {
        editingId = id;
        const node = nodeById(id);
        const container = document.querySelector(`.mind-node[data-id="${CSS.escape(id)}"]`);
        if (!node || !container) return;
        const text = container.querySelector('.node-text');
        const input = document.createElement('input');
        input.maxLength = 160;
        input.value = node.text;
        text.replaceWith(input);
        input.focus(); input.select();
        const finish = (commit) => {
          if (editingId !== id) return;
          editingId = null;
          if (commit && input.value.trim()) {
            node.text = input.value.trim();
            if (id === 'root') map.title = node.text;
            snapshot(); scheduleSave();
          }
          render();
        };
        input.addEventListener('keydown', event => {
          if (event.key === 'Enter') { event.preventDefault(); finish(true); }
          if (event.key === 'Escape') { event.preventDefault(); finish(false); }
          event.stopPropagation();
        });
        input.addEventListener('blur', () => finish(true), { once: true });
      }

      function startNodeDrag(event) {
        if (event.target.tagName === 'INPUT') return;
        const node = nodeById(event.currentTarget.dataset.id);
        if (!node) return;
        selectedId = node.id;
        document.querySelectorAll('.mind-node').forEach(item => item.classList.toggle('selected', item.dataset.id === selectedId));
        drag = { type: 'node', id: node.id, startX: event.clientX, startY: event.clientY, x: node.x, y: node.y, moved: false };
        event.currentTarget.setPointerCapture(event.pointerId);
      }

      function moveNodeDrag(event) {
        if (!drag || drag.type !== 'node') return;
        const node = nodeById(drag.id);
        if (!node) return;
        const dx = (event.clientX - drag.startX) / zoom;
        const dy = (event.clientY - drag.startY) / zoom;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        if (!drag.moved) return;
        node.x = drag.x + dx; node.y = drag.y + dy;
        const item = document.querySelector(`.mind-node[data-id="${CSS.escape(node.id)}"]`);
        if (item) { item.style.left = `${1200 + node.x}px`; item.style.top = `${800 + node.y}px`; }
        renderLinks();
      }

      function applyTransform() {
        el('stage').style.transform = `translate(calc(-50% + ${pan.x}px), calc(-50% + ${pan.y}px)) scale(${zoom})`;
        el('zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
      }

      function fitMap() {
        const bounds = map.nodes.reduce((box, node) => ({ minX: Math.min(box.minX, node.x), maxX: Math.max(box.maxX, node.x), minY: Math.min(box.minY, node.y), maxY: Math.max(box.maxY, node.y) }), { minX: 0, maxX: 0, minY: 0, maxY: 0 });
        const width = Math.max(1, bounds.maxX - bounds.minX + 250);
        const height = Math.max(1, bounds.maxY - bounds.minY + 150);
        const area = el('canvasArea');
        zoom = Math.max(.45, Math.min(1.8, (area.clientWidth - 48) / width, (area.clientHeight - 100) / height));
        pan.x = -((bounds.minX + bounds.maxX) / 2) * zoom;
        pan.y = -((bounds.minY + bounds.maxY) / 2) * zoom;
        applyTransform();
      }

      function showToast(message) {
        const toast = el('toast'); toast.textContent = message; toast.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
      }

      function updateHistoryButtons() {
        el('undoButton').disabled = historyIndex <= 0;
        el('redoButton').disabled = historyIndex >= history.length - 1;
      }

      function undo() {
        if (historyIndex <= 0) return;
        historyIndex--; map = JSON.parse(history[historyIndex]); selectedId = nodeById(selectedId) ? selectedId : 'root'; scheduleSave(); render();
      }
      function redo() {
        if (historyIndex >= history.length - 1) return;
        historyIndex++; map = JSON.parse(history[historyIndex]); selectedId = nodeById(selectedId) ? selectedId : 'root'; scheduleSave(); render();
      }

      function exportSvg() {
        const bounds = map.nodes.reduce((box, node) => ({ minX: Math.min(box.minX, node.x), maxX: Math.max(box.maxX, node.x), minY: Math.min(box.minY, node.y), maxY: Math.max(box.maxY, node.y) }), { minX: 0, maxX: 0, minY: 0, maxY: 0 });
        const width = bounds.maxX - bounds.minX + 440, height = bounds.maxY - bounds.minY + 260;
        const offsetX = 220 - bounds.minX, offsetY = 130 - bounds.minY;
        const paths = map.nodes.filter(node => node.parent).map(node => {
          const parent = nodeById(node.parent), side = node.x >= parent.x ? 1 : -1;
          const x1 = offsetX + parent.x + side * 90, y1 = offsetY + parent.y;
          const x2 = offsetX + node.x - side * 75, y2 = offsetY + node.y;
          const curve = Math.max(38, Math.abs(x2 - x1) * .48);
          return `<path d="M ${x1} ${y1} C ${x1 + side * curve} ${y1}, ${x2 - side * curve} ${y2}, ${x2} ${y2}" fill="none" stroke="${escapeAttr(node.color)}" stroke-width="3" stroke-linecap="round"/>`;
        }).join('');
        const boxes = map.nodes.map(node => {
          const x = offsetX + node.x, y = offsetY + node.y, root = node.id === 'root';
          const fill = root ? '#2b5947' : '#ffffff', color = root ? '#ffffff' : '#202721', w = root ? 190 : 170, h = root ? 58 : 48;
          return `<g><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${root ? '#2b5947' : '#e1e6de'}"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="600" fill="${color}">${escapeAttr(visibleText(node.text))}</text></g>`;
        }).join('');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><rect width="100%" height="100%" fill="#f7f8f4"/>${paths}${boxes}</svg>`;
        download(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }), `${safeFilename(map.title)}.svg`);
        showToast('Đã xuất sơ đồ dạng SVG');
      }

      function exportJson() {
        download(new Blob([JSON.stringify(map, null, 2)], { type: 'application/json;charset=utf-8' }), `${safeFilename(map.title)}.json`);
        showToast('Đã lưu sơ đồ dạng JSON');
      }

      function download(blob, filename) {
        const url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = filename; link.click(); URL.revokeObjectURL(url);
      }

      function safeFilename(value) { return (value || 'so-do-tu-duy').replace(/[\\/:*?"<>|]/g, '-').trim() || 'so-do-tu-duy'; }

      el('mapTitle').addEventListener('input', event => {
        map.title = event.target.value;
        const root = nodeById('root'); if (root) root.text = map.title;
        el('canvasTitle').textContent = map.title;
        renderProjects();
        const rootText = document.querySelector('.mind-node.root .node-text'); if (rootText) rootText.textContent = visibleText(map.title);
        if (!el('detailsOverlay').hidden && selectedId === 'root') el('detailsTitle').textContent = visibleText(map.title);
        scheduleSave();
      });
      el('mapTitle').addEventListener('change', snapshot);
      el('createProject').addEventListener('click', createProject);
      el('toggleSidebar').addEventListener('click', () => {
        projectsState.sidebarVisible = !projectsState.sidebarVisible;
        updateSidebarVisibility();
        persistProjects();
      });
      el('closeDetails').addEventListener('click', closeTopicDetails);
      el('detailsOverlay').addEventListener('click', event => {
        if (event.target === el('detailsOverlay')) closeTopicDetails();
      });
      el('topicText').addEventListener('input', event => {
        const node = nodeById(selectedId);
        if (!node) return;
        node.note = event.target.value;
        scheduleSave();
      });
      el('topicText').addEventListener('change', snapshot);
      const updateTopicField = (field, value) => {
        const node = nodeById(selectedId);
        if (!node) return;
        node[field] = value;
        snapshot();
        scheduleSave();
        render();
      };
      el('topicPriority').addEventListener('change', event => updateTopicField('priority', event.target.value));
      el('topicDeadline').addEventListener('change', event => updateTopicField('deadline', event.target.value));
      el('topicStatus').addEventListener('change', event => updateTopicField('status', event.target.value));
      el('uploadAttachment').addEventListener('click', () => el('attachmentInput').click());
      el('attachmentInput').addEventListener('change', async event => {
        const node = nodeById(selectedId);
        const files = Array.from(event.target.files || []);
        if (!node || !files.length) return;
        node.attachments = Array.isArray(node.attachments) ? node.attachments : [];
        let failedCount = 0;
        for (const file of files) {
          try {
            const dataUrl = await readFileAsDataUrl(file);
            node.attachments.push({ name: file.name, type: file.type, size: file.size, dataUrl });
          } catch (error) {
            failedCount++;
          }
        }
        if (failedCount < files.length) {
          renderAttachments(node);
          snapshot();
          scheduleSave();
        }
        if (failedCount) showToast('Không thể đọc một hoặc nhiều tài liệu đã chọn');
        event.target.value = '';
      });
      el('addChild').addEventListener('click', addChild);
      el('addSibling').addEventListener('click', addSibling);
      el('editNode').addEventListener('click', () => beginEdit(selectedId));
      el('deleteNode').addEventListener('click', deleteSelected);
      el('undoButton').addEventListener('click', undo);
      el('redoButton').addEventListener('click', redo);
      el('exportButton').addEventListener('click', exportSvg);
      el('exportJsonButton').addEventListener('click', exportJson);
      document.querySelectorAll('.action-menu-list .button').forEach(button => {
        button.addEventListener('click', () => { button.closest('.action-menu').open = false; });
      });
      document.querySelectorAll('.view-button').forEach(button => {
        button.addEventListener('click', () => {
          activeView = button.dataset.view;
          renderTaskView();
        });
      });
      el('zoomIn').addEventListener('click', () => { zoom = Math.min(1.8, zoom + .1); applyTransform(); });
      el('zoomOut').addEventListener('click', () => { zoom = Math.max(.45, zoom - .1); applyTransform(); });
      el('fitButton').addEventListener('click', fitMap);
      el('canvasArea').addEventListener('wheel', event => {
        if (!event.ctrlKey && !event.metaKey) return;
        event.preventDefault(); zoom = Math.max(.45, Math.min(1.8, zoom + (event.deltaY < 0 ? .08 : -.08))); applyTransform();
      }, { passive: false });
      el('canvasArea').addEventListener('pointerdown', event => {
        if (event.target.closest('.mind-node, .zoom-controls, .canvas-top, .view-switch, .task-view')) return;
        drag = { type: 'pan', startX: event.clientX, startY: event.clientY, x: pan.x, y: pan.y };
        el('canvasArea').setPointerCapture(event.pointerId);
      });
      el('canvasArea').addEventListener('pointermove', event => {
        if (!drag) return;
        if (drag.type === 'node') { moveNodeDrag(event); return; }
        pan.x = drag.x + event.clientX - drag.startX; pan.y = drag.y + event.clientY - drag.startY; applyTransform();
      });
      el('canvasArea').addEventListener('pointerup', () => {
        if (drag?.type === 'node' && drag.moved) { snapshot(); scheduleSave(); }
        drag = null;
      });
      el('canvasArea').addEventListener('pointercancel', () => {
        if (drag?.type === 'node' && drag.moved) { snapshot(); scheduleSave(); }
        drag = null;
      });
      el('searchInput').addEventListener('input', event => {
        const query = event.target.value.trim().toLocaleLowerCase('vi');
        document.querySelectorAll('.mind-node').forEach(item => {
          const node = nodeById(item.dataset.id);
          item.style.opacity = !query || node.text.toLocaleLowerCase('vi').includes(query) ? '1' : '.22';
        });
      });
      el('importButton').addEventListener('click', () => el('fileInput').click());
      el('fileInput').addEventListener('change', async event => {
        const file = event.target.files[0]; if (!file) return;
        try {
          const imported = JSON.parse(await file.text());
          if (!imported || !Array.isArray(imported.nodes) || !imported.nodes.some(node => node.id === 'root')) throw new Error('invalid map');
          snapshot(); map = { ...imported, id: map.id, title: String(imported.title || 'Sơ đồ mới'), nodes: imported.nodes.map(node => ({ ...node, x: Number(node.x) || 0, y: Number(node.y) || 0, text: String(node.text || ''), note: String(node.note || ''), priority: ['low', 'medium', 'high'].includes(node.priority) ? node.priority : 'medium', deadline: /^\d{4}-\d{2}-\d{2}$/.test(node.deadline || '') ? node.deadline : '', status: ['todo', 'inprogress', 'done'].includes(node.status) ? node.status : 'todo', attachments: Array.isArray(node.attachments) ? node.attachments : [] })) };
          activeView = 'map';
          selectedId = 'root'; fitMap(); snapshot(); scheduleSave(); render(); showToast('Đã mở sơ đồ');
        } catch (_) { showToast('Tệp không đúng định dạng sơ đồ JSON'); }
        event.target.value = '';
      });
      document.addEventListener('keydown', event => {
        const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
        if (event.key === 'Escape' && !el('detailsOverlay').hidden) { closeTopicDetails(); return; }
        if (!el('detailsOverlay').hidden) return;
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') { event.preventDefault(); event.shiftKey ? redo() : undo(); return; }
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y') { event.preventDefault(); redo(); return; }
        if (typing) return;
        if (event.key === 'Tab') { event.preventDefault(); addChild(); }
        if (event.key === 'Enter') { event.preventDefault(); addSibling(); }
        if (event.key === 'F2') { event.preventDefault(); beginEdit(selectedId); }
        if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); deleteSelected(); }
        if (event.key === 'Escape') { selectedId = null; render(); }
      });

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener('load', () => typeof reader.result === 'string' ? resolve(reader.result) : reject(new Error('Invalid file data')));
          reader.addEventListener('error', () => reject(reader.error || new Error('File read failed')));
          reader.readAsDataURL(file);
        });
      }

      function updateSidebarVisibility() {
        el('workspace').classList.toggle('sidebar-hidden', !projectsState.sidebarVisible);
        el('toggleSidebar').setAttribute('aria-expanded', String(projectsState.sidebarVisible));
        el('toggleSidebar').setAttribute('aria-label', projectsState.sidebarVisible ? 'Ẩn không gian làm việc' : 'Hiện không gian làm việc');
        el('toggleSidebar').title = projectsState.sidebarVisible ? 'Ẩn không gian làm việc' : 'Hiện không gian làm việc';
      }

      snapshot();
      render();
      updateSidebarVisibility();
      fitMap();
    })();
  </script>
</body>
</html>
